name: Naver Datalab Scraper

on:
  schedule:
    # 한국 시간 기준 매주 토요일 새벽 4시 (UTC 기준 금요일 19시)
    - cron: '0 19 * * 5'
  workflow_dispatch: # GitHub 웹 인터페이스에서 수동 실행 버튼 활성화

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 체크아웃
      uses: actions/checkout@v4

    - name: Python 3.10 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 의존성 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright 브라우저(Chromium) 및 의존성 설치
      run: playwright install --with-deps chromium

    - name: 스크래퍼 파이썬 스크립트 실행
      run: python scraper_main.py

    - name: 크롤링 결과물(CSV) 및 로그 Artifact 업로드
      uses: actions/upload-artifact@v4
      if: always() # 실패하더라도 로그 등을 확인할 수 있도록 항상 업로드
      with:
        name: datalab-scraping-results
        path: |
          results/
          logs/
